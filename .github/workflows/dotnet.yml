name: RaceDay API CI

on:
  push:
    branches: [ "main", "part2-api", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore RaceDay.sln
      - name: Build API
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
